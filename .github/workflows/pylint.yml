name: Pylint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pylint
        run: python -m pip install pylint
      - name: Analyse Python files
        run: python -m pylint --reports=no --score=no $(git ls-files '*.py') || true
