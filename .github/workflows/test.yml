name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check Python syntax
        run: >-
          python -m py_compile
          base.py config.py generator.py main.py nkiri.py pom.py pom_parser.py utils.py
          test/__init__.py test/main.py test/nkiri.py

      - name: Check module imports
        run: >-
          python -c "from test.nkiri import Thenkiri; from test.main import get_download;
          assert Thenkiri.__name__ == 'Thenkiri'; assert get_download.__name__ == 'get_download'"

      - name: Test CLI and generated model
        run: |
          python pom.py --help
          python pom.py generate --config pom.config.json --output ci_generated.py
          python -m py_compile ci_generated.py
          python -c "from ci_generated import Thenkiri; assert Thenkiri._base_url == 'https://thenkiri.com/'"