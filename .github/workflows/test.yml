name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: >-
          python -m py_compile
          base.py config.py generator.py main.py nkiri.py pom.py pom_parser.py utils.py
          test/__init__.py test/main.py test/nkiri.py

      - name: Check module imports
        run: python -c "from test.nkiri import Thenkiri; from test.main import get_download; print(Thenkiri.__name__, get_download.__name__)"

      - name: Test CLI and generated model
        run: |
          python pom.py --help
          python -c "import json; json.dump({'baseUrl': 'https://example.com', 'pages': [{'name': 'home', 'selectors': {'submit': '#submit'}}]}, open('ci_config.json', 'w'))"
          python pom.py generate --config ci_config.json --output ci_generated.py
          python -m py_compile ci_generated.py
          python -c "from ci_generated import Example; assert Example._base_url == 'https://example.com'; print('Generator check passed')"